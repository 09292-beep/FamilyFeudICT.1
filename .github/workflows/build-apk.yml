name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Web to APK using Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest="https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json"
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk 
